[project]
name = "smoother-py"
version = "0.1.3"
description = "Spatial smoothing methods for probability maps."
readme = "README.md"
requires-python = ">=3.11"

license = { file = "LICENSE" }

authors = [
  {name = "Felipe Carlos", email = "efelipecarlos@gmail.com"}
]

keywords = [
  "land use and land cover",
  "lulc",
  "satellite",
  "time-series",
  "metrics",
  "remote-sensing"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26.4",
]

[project.urls]
homepage = "https://github.com/spatial-tools/smoother.py"
repository = "https://github.com/spatial-tools/smoother.py"

[dependency-groups]
dev = [
    "nanobind>=2.0",
    "pytest>=7.4.4",
    "ruff>=0.1.13",
    "pre-commit>=3.6.0",
    "xarray>=2024.1",
    "dask[array]>=2024.1",
]

[project.optional-dependencies]
xarray = ["xarray>=2024.1"]
examples = [
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "matplotlib>=3.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "UP",  # pyupgrade
  "I",   # isort
  "N",   # pep8 naming
  "PL",  # pylint
]

ignore = [
  "PLR0913"
]

[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# Build configuration for scikit-build-core
wheel.expand-macos-universal-tags = true
wheel.packages = ["smoother"]

# Build stable ABI (abi3) wheels on Python >= 3.12
wheel.py-api = "cp312"
cmake.version = ">=3.15"

# Manifest configuration for source distributions
sdist.include = [
    "README.md",
    "LICENSE",
    "CMakeLists.txt",
    "pyproject.toml",
    "src/**/*.cpp",
    "examples/**/*.py",
    "examples/**/*.ipynb",
    "examples/**/*.tif",
    "examples/**/*.qml",
    "examples/**/*.md",
]

sdist.exclude = [
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "*.so",
    "*.dylib",
    "*.dll",
    ".git*",
    "build",
    "dist",
    "*.egg-info",
]

[tool.cibuildwheel]
# cp312 builds a stable ABI (abi3) wheel that also covers Python >= 3.13
build = "cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686"
test-requires = "pytest"
test-command = "pytest {project}/tests"
